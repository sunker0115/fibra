name: 发布到 Maven Central 与 npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已存在且位于 main 历史中的正式版本标签，例如 v0.5.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fibra-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.release-ref.outputs.commit }}
    env:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Dfile.encoding=UTF-8
    steps:
      - name: 检出指定标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: 验证标签、版本和 main 归属
        id: release-ref
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "版本标签必须符合 v<major>.<minor>.<patch> 或带字母开头的预发布 qualifier" >&2
            exit 1
          fi
          revision="$(sed -n 's/.*<revision>\([^<]*\)<\/revision>.*/\1/p' pom.xml)"
          if [[ -z "$revision" || "$revision" == *-SNAPSHOT ]]; then
            echo "根 POM revision 必须是非 SNAPSHOT 正式版本" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$revision" ]]; then
            echo "标签 $RELEASE_TAG 与根 POM 版本 $revision 不一致" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$WORKFLOW_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "workflow_dispatch 必须从发布标签 refs/tags/$RELEASE_TAG 运行，实际为 $WORKFLOW_REF" >&2
            exit 1
          fi
          workflow_commit="$(git rev-parse --verify "$WORKFLOW_SHA^{commit}")"
          if [[ "$workflow_commit" != "$tag_commit" ]]; then
            echo "workflow_dispatch 提交 $workflow_commit 与标签提交 $tag_commit 不一致" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "检出提交与标签提交不一致" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "正式版本标签必须位于 origin/main 历史中" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: 配置 Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: 配置 Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          package-manager-cache: false

      - name: 配置项目锁定的 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: client/package.json
          run_install: false

      - name: 确认 pnpm 版本
        run: pnpm --version

      - name: 配置项目锁定的 Maven 版本
        shell: bash
        run: |
          maven_version="$(sed -n 's/.*<maven.runtime.version>\([^<]*\)<\/maven.runtime.version>.*/\1/p' pom.xml)"
          maven_sha512="$(sed -n 's/.*<maven.runtime.sha512>\([^<]*\)<\/maven.runtime.sha512>.*/\1/p' pom.xml)"
          archive="$RUNNER_TEMP/apache-maven-$maven_version-bin.tar.gz"
          curl --fail --silent --show-error --location \
            "https://archive.apache.org/dist/maven/maven-3/$maven_version/binaries/apache-maven-$maven_version-bin.tar.gz" \
            --output "$archive"
          echo "$maven_sha512  $archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$maven_version/bin" >> "$GITHUB_PATH"

      - name: 配置项目锁定的 ripgrep 版本
        shell: bash
        run: |
          ripgrep_version="$(sed -n 's/.*<ripgrep.runtime.version>\([^<]*\)<\/ripgrep.runtime.version>.*/\1/p' pom.xml)"
          ripgrep_sha256="$(sed -n 's/.*<ripgrep.runtime.sha256>\([^<]*\)<\/ripgrep.runtime.sha256>.*/\1/p' pom.xml)"
          archive="$RUNNER_TEMP/ripgrep-v$ripgrep_version-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v$ripgrep_version/$(basename "$archive")" \
            --output "$archive"
          echo "$ripgrep_sha256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" rg
          chmod 0755 "$RUNNER_TEMP/rg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 确认构建与真实插件验收环境
        run: |
          mvn --version
          node --version
          bash --version
          rg --version

      - name: 全量构建与兼容性验收
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: 验证纯 API 与协议 npm 包
        run: |
          pnpm --dir client install --frozen-lockfile
          pack_dir="$RUNNER_TEMP/fibra-npm-pack"
          mkdir -p "$pack_dir"
          FIBRA_NPM_PACK_DIR="$pack_dir" scripts/verify-client-packages.sh

      - name: 保存已验证的 npm 制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fibra-npm-packages-${{ steps.release-ref.outputs.commit }}
          path: ${{ runner.temp }}/fibra-npm-pack/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: 验证 Maven 制品与发行 ZIP/目录树可复现
        run: scripts/verify-reproducible-release.sh

      - name: 验证仓库外项目可直接消费发布制品
        run: scripts/verify-distribution.sh

      - name: 验证架构边界
        run: scripts/verify-architecture-boundaries.sh

  publish-central:
    needs: verify-release
    environment: central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Dfile.encoding=UTF-8
    steps:
      - name: 检出已验证提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit }}
          persist-credentials: false

      - name: 配置 Java 21 和 Central 凭据映射
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD

      - name: 配置项目锁定的 Maven 版本
        shell: bash
        run: |
          maven_version="$(sed -n 's/.*<maven.runtime.version>\([^<]*\)<\/maven.runtime.version>.*/\1/p' pom.xml)"
          maven_sha512="$(sed -n 's/.*<maven.runtime.sha512>\([^<]*\)<\/maven.runtime.sha512>.*/\1/p' pom.xml)"
          archive="$RUNNER_TEMP/apache-maven-$maven_version-bin.tar.gz"
          curl --fail --silent --show-error --location \
            "https://archive.apache.org/dist/maven/maven-3/$maven_version/binaries/apache-maven-$maven_version-bin.tar.gz" \
            --output "$archive"
          echo "$maven_sha512  $archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$maven_version/bin" >> "$GITHUB_PATH"

      - name: 签名并上传 Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress clean deploy -Pcentral-release
          -pl "$(scripts/release-maven-modules.sh csv)"
          -am -DskipTests -Darchetype.test.skip=true

  publish-npm:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出已验证提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.commit }}
          persist-credentials: false

      - name: 配置支持 npm Trusted Publishing 的 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 安装锁定的 npm
        run: |
          npm install --global npm@11.15.0
          npm --version

      - name: 下载已验证的 npm 制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fibra-npm-packages-${{ needs.verify-release.outputs.commit }}
          path: ${{ runner.temp }}/fibra-npm-pack

      - name: 核对待发布 npm 制品
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "npm 发布提交与 provenance 的 GITHUB_SHA 不一致" >&2
            exit 1
          fi
          pack_dir="$RUNNER_TEMP/fibra-npm-pack"
          find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print | LC_ALL=C sort > "$RUNNER_TEMP/fibra-npm-tarballs"
          [[ "$(wc -l < "$RUNNER_TEMP/fibra-npm-tarballs" | tr -d ' ')" == 2 ]]

      - name: 通过 OIDC 发布 npm 制品并生成 provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          revision="${RELEASE_TAG#v}"
          npm_tag=latest
          if [[ "$revision" == *-* ]]; then
            qualifier="${revision#*-}"
            npm_tag="${qualifier%%.*}"
          fi
          while IFS= read -r tarball; do
            npm publish "$tarball" --access public --tag "$npm_tag" --provenance
          done < "$RUNNER_TEMP/fibra-npm-tarballs"
