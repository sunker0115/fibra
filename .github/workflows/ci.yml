name: 全量验证与 API 兼容门禁

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fibra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      JAVA_TOOL_OPTIONS: -Duser.timezone=UTC -Dfile.encoding=UTF-8
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: '21'
          cache: maven

      - name: 配置 Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          package-manager-cache: false

      - name: 配置项目锁定的 Maven 版本
        shell: bash
        run: |
          maven_version="$(sed -n 's/.*<maven.runtime.version>\([^<]*\)<\/maven.runtime.version>.*/\1/p' pom.xml)"
          maven_sha512="$(sed -n 's/.*<maven.runtime.sha512>\([^<]*\)<\/maven.runtime.sha512>.*/\1/p' pom.xml)"
          archive="$RUNNER_TEMP/apache-maven-$maven_version-bin.tar.gz"
          curl --fail --silent --show-error --location \
            "https://archive.apache.org/dist/maven/maven-3/$maven_version/binaries/apache-maven-$maven_version-bin.tar.gz" \
            --output "$archive"
          echo "$maven_sha512  $archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$maven_version/bin" >> "$GITHUB_PATH"

      - name: 配置项目锁定的 ripgrep 版本
        shell: bash
        run: |
          ripgrep_version="$(sed -n 's/.*<ripgrep.runtime.version>\([^<]*\)<\/ripgrep.runtime.version>.*/\1/p' pom.xml)"
          ripgrep_sha256="$(sed -n 's/.*<ripgrep.runtime.sha256>\([^<]*\)<\/ripgrep.runtime.sha256>.*/\1/p' pom.xml)"
          archive="$RUNNER_TEMP/ripgrep-v$ripgrep_version-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v$ripgrep_version/$(basename "$archive")" \
            --output "$archive"
          echo "$ripgrep_sha256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" rg
          chmod 0755 "$RUNNER_TEMP/rg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: 确认构建与真实插件验收环境
        run: |
          mvn --version
          node --version
          bash --version
          rg --version

      - name: 验证短超时诊断门禁
        env:
          FIBRA_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/fibra-ci-hang-diagnostics
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 fibra-distribution/src/test/python/test_verify_cli_tty.py
          scripts/verify-short-timeout-diagnostics.sh

      - name: 全量构建与兼容性验收
        env:
          FIBRA_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/fibra-ci-hang-diagnostics
        run: >-
          scripts/run-ci-with-jvm-diagnostics.sh
          mvn --batch-mode --no-transfer-progress
          -Dsurefire.timeout=300 -Dfailsafe.timeout=300
          clean verify

      - name: 验证架构边界
        run: scripts/verify-architecture-boundaries.sh

      - name: 验证 Maven 制品与发行 ZIP/目录树可复现
        run: scripts/verify-reproducible-release.sh

      - name: 验证空仓分发
        if: ${{ github.event_name == 'push' }}
        run: scripts/verify-distribution.sh

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-hang-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fibra-ci-hang-diagnostics
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 7

  npm-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.20.0'
          package-manager-cache: false

      - name: 配置项目锁定的 pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: client/package.json
          run_install: false

      - name: 确认 pnpm 版本
        run: pnpm --version

      - name: 验证纯 API 与协议 npm 包
        run: |
          pnpm --dir client install --frozen-lockfile
          scripts/verify-client-packages.sh
