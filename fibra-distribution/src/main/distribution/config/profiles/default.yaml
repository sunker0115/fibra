- id: fs-provider
  plugin: {id: fibra-fs-local, facet: main, definition: fs-local}
  config:
    root: {$ref: /fibra/workspaceRoot}
    spillDirectory: .fibra-spill
  realm: {fibra.fs: files}
- id: fs-tools
  plugin: {id: fibra-tool-fs, facet: main, definition: tool-fs}
  realm: {fibra.fs: files}
- id: subprocess-provider
  plugin: {id: fibra-subprocess-local, facet: main, definition: fibra-subprocess-local}
  config:
    nodeExecutable: {$ref: /fibra/nodeExecutable}
  realm: {fibra.subprocess: processes}
- id: search-tools
  plugin: {id: fibra-tool-fs-search, facet: main, definition: tool-fs-search}
  config:
    rgExecutable: {$ref: /fibra/rgExecutable}
    workdir: {$ref: /fibra/workspaceRoot}
  realm: {fibra.subprocess: processes}
- id: shell-provider
  plugin: {id: fibra-shell-local, facet: main, definition: fibra-shell-local}
  config:
    bashExecutable: {$ref: /fibra/bashExecutable}
    outputMaxBytes: 1048576
    graceMillis: 500
  realm: {fibra.subprocess: processes, fibra.shell: shells}
- id: shell-tools
  plugin: {id: fibra-tool-shell, facet: main, definition: fibra-tool-shell}
  realm: {fibra.subprocess: processes, fibra.shell: shells}
- id: storage-provider
  plugin: {id: fibra-storage-json, facet: main, definition: storage-json}
  config:
    root: {$ref: /fibra/storageRoot}
  realm: {fibra.storage: shared}
- id: storage-tools
  plugin: {id: fibra-tool-storage, facet: main, definition: tool-storage}
  realm: {fibra.storage: shared}
